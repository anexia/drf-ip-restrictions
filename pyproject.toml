[build-system]
requires = ["setuptools>=42", "wheel>=0.37"]
build-backend = "setuptools.build_meta"

[project]
name = "drf-ip-restrictions"
version = "1.1.0"
description = "A library that allows IP restrictions for views/endpoints in Django REST framework."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]


dependencies = [
    "django>=4.2,<5.2",
    "djangorestframework>=3.15,<4",
    "django-filter>=24.3,<25",
    "django-ipware>=7.0.1,<7.1",
]


[project.urls]
Homepage = "https://github.com/anexia/drf-ip-restrictions"
Repository = "https://github.com/anexia/drf-ip-restrictions"